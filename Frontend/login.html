<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Aggregator - Authentication</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  
  <header class="navbar">
    <div class="nav-container">
      <a href="/" class="nav-brand">SOH</a>
      <nav class="nav-menu">
        <a href="/" class="nav-item">Events</a>
        <a href="/" class="nav-item">Trending</a>
        <a href="/" class="nav-item">Add Event</a>

      </nav>
      <div>
        <a href="/login.html" class="btn-white-pill">Login</a>
      </div>
    </div>
  </header>

 
  <div class="auth-page-wrapper">
    <div class="auth-page-header" style="text-align: center;">
      <div class="auth-tag">AUTHENTICATION</div>
      <h1>Simple access for submissions and comments</h1>
      <p>Demo accounts after seeding: admin <code>admin@studenthub.dev / admin123</code>, user <code>riya@studenthub.dev / demo1234</code>.</p>
    </div>

    <div id="alertBox" class="auth-alert" style="max-width: 420px; margin: 0 auto 20px;"></div>


    <div style="display: flex; justify-content: center; gap: 15px; margin-bottom: 30px;">
      <button id="tabLogin" type="button" class="btn-white-pill" onclick="showLogin()" style="width: 130px; justify-content: center;">Login</button>
      <button id="tabSignup" type="button" class="btn-white-pill" onclick="showSignup()" style="width: 130px; justify-content: center;">Sign Up</button>
    </div>

    
    <div style="display: flex; justify-content: center; width: 100%;">
      
      
      <div class="auth-box" id="loginBox" style="width: 100%; max-width: 420px;">
        <div class="auth-box-tag">WELCOME BACK</div>
        <h2>Login</h2>
        <form id="loginForm" onsubmit="handleSignIn(event)">
          <div class="form-group">
            <label for="loginEmail">Email</label>
            <input type="email" id="loginEmail" class="form-input" placeholder="riya@studenthub.dev" required />
          </div>
          <!-- Login Wale Form Ke Liye -->
          <div class="form-group">
            <label for="loginPassword">Password</label>
            <div class="password-wrapper">
              <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" required />
              <button type="button" class="toggle-password" onclick="togglePasswordVisibility('loginPassword', this)">👁️</button>
            </div>
          </div>
          <button type="submit" class="auth-submit-btn">Login</button>
        </form>
      </div>

      
      <div class="auth-box" id="signupBox" style="display: none; width: 100%; max-width: 420px;">
        <div class="auth-box-tag">NEW HERE</div>
        <h2>Create account</h2>
        <form id="signupForm" onsubmit="handleSignUp(event)">
          <div class="form-group">
            <label for="regName">Full name</label>
            <input type="text" id="regName" class="form-input" placeholder="Dev Rastogi" required />
          </div>
          <div class="form-group">
            <label for="regEmail">Email</label>
            <input type="email" id="regEmail" class="form-input" placeholder="dev@example.com" required />
          </div>
          <!-- Sign Up Wale Form Ke Liye -->
          <div class="form-group">
            <label for="regPassword">Password</label>
            <div class="password-wrapper">
              <input type="password" id="regPassword" class="form-input" placeholder="••••••••" minlength="4" required />
              <button type="button" class="toggle-password" onclick="togglePasswordVisibility('regPassword', this)">👁️</button>
            </div>
          </div>
          <button type="submit" class="auth-submit-btn">Create account</button>
        </form>
      </div>
      
    </div>

    <div style="text-align: center; margin-top: 2.5rem;">
      <a href="/" style="color: var(--text-subtle); text-decoration: none; font-size: 0.88rem;">&larr; Return to Dashboard</a>
    </div>
  </div>

  <script>
    
    function showLogin() {
      document.getElementById('loginBox').style.display = 'block';
      document.getElementById('signupBox').style.display = 'none';
      document.getElementById('tabLogin').className = 'btn-white-pill';
      document.getElementById('tabSignup').className = 'btn-ghost-pill';
      document.getElementById('alertBox').style.display = 'none';
    }

    function showSignup(prefillEmail = "") {
      document.getElementById('loginBox').style.display = 'none';
      document.getElementById('signupBox').style.display = 'block';
      document.getElementById('tabLogin').className = 'btn-ghost-pill';
      document.getElementById('tabSignup').className = 'btn-white-pill';
      
      if (prefillEmail) {
        document.getElementById('regEmail').value = prefillEmail;
      }
    }

    function showAlert(msg, type = "error") {
      const box = document.getElementById("alertBox");
      box.className = `auth-alert ${type}`;
      box.textContent = msg;
      box.style.display = 'block';
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function handleSignIn(e) {
      e.preventDefault();
      const email = document.getElementById("loginEmail").value.trim().toLowerCase();
      const password = document.getElementById("loginPassword").value;

      const users = JSON.parse(localStorage.getItem("app_registered_users") || "{}");

      
      if (email === "admin@studenthub.dev" && password === "admin123") {
        loginUser("Admin", email);
        return;
      }
      if (email === "riya@studenthub.dev" && password === "demo1234") {
        loginUser("Riya", email);
        return;
      }

      
      if (!users[email]) {
        showAlert("Account not found. Redirecting to Sign up...", "error");
        setTimeout(() => {
          showSignup(email);
        }, 1500);
        return;
      }

      if (users[email].password !== password) {
        showAlert("Invalid email or password. Please try again.");
        return;
      }

      loginUser(users[email].name, email);
    }

    function handleSignUp(e) {
      e.preventDefault();
      const name = document.getElementById("regName").value.trim();
      const email = document.getElementById("regEmail").value.trim().toLowerCase();
      const password = document.getElementById("regPassword").value;

      let users = JSON.parse(localStorage.getItem("app_registered_users") || "{}");

      if (users[email]) {
        showAlert("An account with this email already exists. Redirecting to Login...", "error");
        setTimeout(() => {
          showLogin();
          document.getElementById('loginEmail').value = email;
        }, 1500);
        return;
      }

      users[email] = { name: name, password: password, registeredAt: new Date().toISOString() };
      localStorage.setItem("app_registered_users", JSON.stringify(users));

      loginUser(name, email);
    }

    function loginUser(name, email) {
      localStorage.setItem("user", JSON.stringify({
        name: name,
        email: email,
        isLoggedIn: true,
        loginTime: new Date().toISOString()
      }));

      showAlert("Authentication successful! Redirecting...", "success");
      setTimeout(() => {
        window.location.href = "/";
      }, 600);
    }

    // Password Show/Hide karne ka logic
    function togglePasswordVisibility(inputId, buttonElement) {
      const input = document.getElementById(inputId);
      if (input.type === "password") {
        input.type = "text";
        buttonElement.textContent = "🙈"; // Hide wala icon
      } else {
        input.type = "password";
        buttonElement.textContent = "👁️"; // Show wala icon
      }
    }
  </script>
</body>
</html>
